<script>
  // Navbar scroll
  const nav = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 60);
  });

  // Reveal on scroll
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); } });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
  reveals.forEach(r => observer.observe(r));

  // Mobile nav
  function toggleMobileNav(force) {
    const menu = document.getElementById('mobile-nav'), btn = document.getElementById('hamburger');
    const open = menu.classList.toggle('open', typeof force === 'boolean' ? force : undefined);
    btn.setAttribute('aria-expanded', String(open));
    // the page behind the menu stays put while it is open
    document.documentElement.style.overflow = open ? 'hidden' : '';
    if (open) menu.querySelector('.close-nav').focus(); else if (document.activeElement && menu.contains(document.activeElement)) btn.focus();
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.getElementById('mobile-nav').classList.contains('open')) toggleMobileNav(false); });
</script>
